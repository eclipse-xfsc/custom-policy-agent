apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app.name" . | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
    app.kubernetes.io/instance: {{ include "app.revision" . }}
    app.kubernetes.io/part-of: rse
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "app.labels" . | nindent 8 }}
      annotations:
        {{- include "app.metricsAnnotations" . | nindent 8 }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      securityContext:
        {{- include "app.securitycontext" . | nindent 8 }}

      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        - name: {{ . | quote }}
      {{- end }}

      containers:
        - name: {{ include "app.name" . }}
          image: "{{ .Values.image.repository }}/{{ .Values.image.name }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | quote }}

          {{- $annotations := default dict .Values.podAnnotations }}
          {{- $injectionEnabled := eq (toString (default "false" (index $annotations "inject.xfsc.io/enabled"))) "true" }}

          {{- if .Values.useSecretRef }}
          envFrom:
            - secretRef:
                name: {{ .Values.secretRefName | quote }}
          {{- else if .Values.useConfigMap }}
          envFrom:
            - configMapRef:
                name: {{ .Values.configMapName | quote }}
          {{- end }}

          env:
            # --------------------------------------------------
            # Application configuration
            # Always provided regardless of injection mode
            # --------------------------------------------------

            - name: LOG_LEVEL
              value: {{ .Values.log.level | default "INFO" | quote }}

            - name: LOG_ENCODING
              value: {{ .Values.log.encoding | default "json" | quote }}

            - name: HTTP_HOST
              value: {{ .Values.policy.http.host | quote }}

            - name: HTTP_PORT
              value: {{ .Values.policy.http.port | quote }}

            - name: HTTP_IDLE_TIMEOUT
              value: {{ .Values.policy.http.timeout.idle | quote }}

            - name: HTTP_READ_TIMEOUT
              value: {{ .Values.policy.http.timeout.read | quote }}

            - name: HTTP_WRITE_TIMEOUT
              value: {{ .Values.policy.http.timeout.write | quote }}

            - name: OCM_ADDR
              value: {{ .Values.addresses.ocm | quote }}

            - name: TASK_ADDR
              value: {{ .Values.addresses.task | quote }}

            - name: CACHE_ADDR
              value: {{ .Values.addresses.cache | quote }}

            {{- if .Values.mongo.collection }}
            - name: MONGO_EXPIRATION
              value: {{ .Values.mongo.collection | quote }}
            {{- end }}

            {{- if .Values.memoryStorage }}
            - name: {{ .Values.memoryStorage.policiesRepoVar }}
              value: {{ .Values.memoryStorage.policiesRepo | quote }}

            - name: {{ .Values.memoryStorage.policiesFolderVar }}
              value: {{ .Values.memoryStorage.policiesFolder | quote }}
            {{- end }}

            {{- if not $injectionEnabled }}
            # --------------------------------------------------
            # Standalone deployment
            # Dependencies resolved from values.yaml
            # --------------------------------------------------

            {{- if .Values.mongo.addr }}
            - name: MONGO_ADDR
              value: {{ .Values.mongo.addr | quote }}
            {{- end }}

            {{- if .Values.mongo.user }}
            - name: MONGO_USER
              value: {{ .Values.mongo.user | quote }}
            {{- end }}

            {{- if .Values.mongo.pass }}
            - name: MONGO_PASS
              value: {{ .Values.mongo.pass | quote }}
            {{- end }}

            {{- if .Values.mongo.dbname }}
            - name: MONGO_DB
              value: {{ .Values.mongo.dbname | quote }}
            {{- end }}

            - name: NATS_URL
              value: {{ .Values.policy.nats.url | quote }}

            - name: NATS_SUBJECT
              value: {{ .Values.policy.nats.subject | quote }}

            - name: DID_RESOLVER
              value: {{ .Values.addresses.didResolver | quote }}

            - name: SIGNER_URL
              value: {{ .Values.addresses.signer | quote }}

            {{- end }}

            # --------------------------------------------------
            # Additional environment variables
            # --------------------------------------------------

            {{- with .Values.extraVars }}
            {{- toYaml . | nindent 12 }}
            {{- end }}

            # --------------------------------------------------
            # Additional secret references
            # --------------------------------------------------

            {{- range $key, $value := .Values.secretEnv }}
            - name: {{ $key | quote }}
              valueFrom:
                secretKeyRef:
                  name: {{ $value.name | quote }}
                  key: {{ $value.key | quote }}
            {{- end }}

          ports:
            {{- if .Values.metrics.enabled }}
            - name: monitoring
              containerPort: {{ .Values.metrics.port }}
            {{- end }}

            - name: http
              containerPort: {{ .Values.policy.http.port }}

          readinessProbe:
            httpGet:
              path: /readiness
              port: {{ .Values.policy.http.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
            successThreshold: 2
            failureThreshold: 2
            timeoutSeconds: 5

          resources:
            {{- toYaml .Values.resources | nindent 12 }}