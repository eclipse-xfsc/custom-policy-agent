# Default Helm values: MongoDB storage with XFSC resource injection disabled.
replicaCount: 1
name: policy
nameOverride: ""

image:
  repository: node-654e3bca7fbeeed18f81d7c7.ps-xaas.io
  name: tsa/policy
  tag: "latest"
  sha: ""
  pullPolicy: IfNotPresent
  pullSecrets: deployment-key-light

useConfigMap: false
configMapName: my-configmap
useSecretRef: false
secretRefName: my-secret

podAnnotations:
  inject.xfsc.io/enabled: "false"
  inject.xfsc.io/needs: "nats,task,cache,did-resolver,signer"

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 70

metrics:
  enabled: true
  port: 2112
  addr: ":2112"

log:
  level: "debug"

service:
  port: 8080

policy:
  externalAddr: "http://policy:8080"
  http:
    host: ""
    port: 8080
    timeout:
      idle: 120s
      read: 10s
      write: 10s
  nats:
    url: "nats://nats:4222"
    subject: "policy_notifier"
  repository:
    enabled: false
    cloneUrl: ""
    user: ""
    pass: ""
    branch: "main"
    folder: ""
    lockOnValidationFailure: false

mongo:
  addr: "mongodb://mongodb:27017/policy"
  user: ""
  pass: ""
  dbname: policy
  collection: policies
  authMechanism: SCRAM-SHA-1

addresses:
  cache: "http://cache:8080"
  task: "http://task:8080"
  didResolver: "http://did-resolver:8080"
  signer: "http://signer:8080"
  ocm: "http://ocm:8080"

refresher:
  pollInterval: 10s

autoImport:
  pollInterval: 10s

auth:
  enabled: false
  jwkUrl: ""
  refreshInterval: 1h

oauth:
  clientId: ""
  clientSecret: ""
  tokenUrl: ""

ipFilter:
  enabled: false
  allowedIPs: []

ingress:
  enabled: false
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /$2
  tlsEnabled: true
  frontendDomain: tsa.xfsc.dev
  frontendTlsSecretName: cert-manager-tls

istio:
  injection:
    pod: false

extraVars: []
secretEnv: {}
